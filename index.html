<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09121b">
  <meta name="description" content="Инструменты в браузере. Оформите снимок терминала и сохраните его как PNG.">
  <title data-i18n="pageTitle">Главная · xinit.ru</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-48x48.png" type="image/png" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Roboto:wdth,wght@80,300&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
  <script src="site-language.js" defer></script>
  <script src="site-footer.js" defer></script>
  <script src="site-navigation.js" defer></script>
  <script src="home.js?v=4" defer></script>
</head>
<body>
  <header class="site-bar">
    <nav class="top-menu" data-i18n-label="navigation" aria-label="Навигация">
      <div class="site-navigation">
        <button class="site-menu-toggle" type="button" aria-controls="site-menu" aria-expanded="false"
          data-i18n-label="menu" aria-label="Меню" hidden>
          <span aria-hidden="true"></span>
        </button>
        <ul class="site-menu" id="site-menu">
          <li><a class="site-nav-link" href="term/" data-i18n="terminalTitle">Снимок терминала</a></li>
        </ul>
      </div>
      <div class="top-menu-tools">
        <a class="telegram-link" href="https://t.me/lofi_dev"
          data-i18n-label="telegram" data-i18n-title="telegram"
          aria-label="Telegram-канал Lofi Developer" title="Telegram-канал Lofi Developer">
          <span class="telegram-icon" aria-hidden="true"></span>
        </a>
        <select id="interface-language" data-i18n-label="language" aria-label="Язык интерфейса">
          <option value="ru" lang="ru">RU</option>
          <option value="en" lang="en">EN</option>
        </select>
      </div>
    </nav>
  </header>

  <main class="app">
    <header class="intro">
      <h1 class="home-wordmark">
        <span class="home-wordmark-prompt" aria-hidden="true">&gt;</span>
        XINIT.RU
        <span class="home-wordmark-cursor" aria-hidden="true"></span>
      </h1>
      <p data-i18n="intro">Небольшие утилиты для работы и публикаций.</p>
    </header>

    <section class="panel home-feature" aria-labelledby="terminal-title">
      <div class="home-feature-copy">
        <h2 id="terminal-title" data-i18n="terminalTitle">Снимок терминала</h2>
        <p class="home-feature-description" data-i18n="terminalDescription">Создайте скриншот терминала для постов, иллюстраций и презентаций</p>
        <a class="action-button" href="term/">
          <span data-i18n="openEditor">Открыть редактор</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <figure class="home-preview">
        <div class="preview-stage" aria-hidden="true">
          <div class="terminal-window home-terminal">
            <div class="home-terminal-bar">
              <span class="home-terminal-lights"></span>
              <span>terminal</span>
            </div>
            <div class="home-terminal-content">
              <div class="home-terminal-command"><span>$</span> python report.py</div>
              <div>Reading data… OK</div>
              <div>Records processed: 42</div>
              <div>Report saved to report.csv</div>
              <div class="home-terminal-cursor"><span>$</span> <span class="home-terminal-block"></span></div>
            </div>
          </div>
        </div>
        <figcaption class="home-preview-caption">
          <span data-i18n="preview">Пример снимка</span>
          <span>PNG</span>
        </figcaption>
      </figure>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer-content">
      <span>© <span data-current-year>2026</span> Digital Partizan</span>
    </div>
  </footer>
</body>
</html>
